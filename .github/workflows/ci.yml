name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Windows is a supported daemon host. These steps cannot run the Windows
      # tests on a Linux runner, but they keep the Windows build compiling and
      # its platform-tagged code vetted, so a unix-only API cannot slip in.
      - name: Build for Windows
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
      - name: Vet for Windows
        run: GOOS=windows go vet ./...
