name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: exercises the whole pipeline with the real signing secrets
  # (build, sign, install-test, generate every repository) but publishes
  # nothing. The generated repositories and packages are uploaded as a
  # workflow artifact for inspection instead.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run build (no tag is created)
        default: "0.0.0"
        required: true

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve release version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "TAG_NAME=v${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "Dry run: building as v${{ inputs.version }}, nothing will be published"
          else
            echo "TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Build release binaries
        env:
          # Disable cgo so every Linux binary is statically linked. With cgo
          # left at its default, the build that matches the runner's own
          # architecture links against the runner's glibc and then fails on
          # Alpine (musl) and on distributions with an older glibc, while the
          # cross-compiled architecture comes out static. Nothing in this
          # project needs cgo.
          CGO_ENABLED: "0"
        run: |
          VERSION="${TAG_NAME#v}"
          LDFLAGS="-s -w -X github.com/ekovshilovsky/op-forward/cmd.Version=${VERSION}"
          for PAIR in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            OS=$(echo "$PAIR" | cut -d' ' -f1)
            ARCH=$(echo "$PAIR" | cut -d' ' -f2)
            DIR="op-forward_${VERSION}_${OS}_${ARCH}"
            mkdir -p "dist/${DIR}"
            GOOS="$OS" GOARCH="$ARCH" go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${DIR}/op-forward" .
            tar -czf "dist/${DIR}.tar.gz" -C "dist/${DIR}" op-forward
          done

      - name: Verify Linux binaries are statically linked
        run: |
          for BIN in dist/op-forward_*_linux_*/op-forward; do
            DESC=$(file "$BIN")
            echo "$DESC"
            case "$DESC" in
              *"statically linked"*) ;;
              *) echo "::error::$BIN is not statically linked; it would fail on Alpine and older glibc distributions"; exit 1 ;;
            esac
          done

      - name: Create release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" dist/*.tar.gz \
            --title "$TAG_NAME" \
            --generate-notes

      - name: Update Homebrew formula
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG_NAME#v}"
          SHA_DARWIN_ARM64=$(sha256sum dist/op-forward_${VERSION}_darwin_arm64.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum dist/op-forward_${VERSION}_darwin_amd64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum dist/op-forward_${VERSION}_linux_arm64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum dist/op-forward_${VERSION}_linux_amd64.tar.gz | cut -d' ' -f1)

          cat > /tmp/op-forward.rb <<FORMULA_EOF
          class OpForward < Formula
            desc "Forward 1Password CLI across SSH boundaries with biometric auth"
            homepage "https://github.com/ekovshilovsky/op-forward"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/ekovshilovsky/op-forward/releases/download/v${VERSION}/op-forward_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/ekovshilovsky/op-forward/releases/download/v${VERSION}/op-forward_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/ekovshilovsky/op-forward/releases/download/v${VERSION}/op-forward_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/ekovshilovsky/op-forward/releases/download/v${VERSION}/op-forward_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "op-forward"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/op-forward version")
            end
          end
          FORMULA_EOF

          git clone "https://x-access-token:${GH_TOKEN}@github.com/ekovshilovsky/homebrew-tap.git" /tmp/homebrew-tap
          cp /tmp/op-forward.rb /tmp/homebrew-tap/Formula/op-forward.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/op-forward.rb
          git diff --cached --quiet || git commit -m "Update op-forward to ${VERSION}"
          git push

      - name: Import package signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APK_PRIVATE_KEY: ${{ secrets.APK_RSA_PRIVATE_KEY }}
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/keys"
          # One PGP key signs the APT repository metadata, the RPM packages, and
          # the RPM repository metadata. nfpm reads it from a file.
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/keys/rpm-key.asc"
            echo "NFPM_RPM_KEY_FILE=$RUNNER_TEMP/keys/rpm-key.asc" >> "$GITHUB_ENV"
          fi
          # Alpine requires an RSA key. Without it, apk packages are built
          # unsigned and the Alpine repository is not published.
          if [ -n "${APK_PRIVATE_KEY:-}" ]; then
            echo "$APK_PRIVATE_KEY" > "$RUNNER_TEMP/keys/op-forward.rsa"
            echo "NFPM_APK_KEY_FILE=$RUNNER_TEMP/keys/op-forward.rsa" >> "$GITHUB_ENV"
          fi

      - name: Build Linux packages (deb, rpm, apk, Arch)
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          # Install nfpm from its prebuilt release, pinned by version and
          # checksum. Building it with `go install` ties the release job to
          # whatever Go version nfpm's module currently demands, which is
          # unrelated to the toolchain this project pins in go.mod.
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version | head -1
          VERSION="${TAG_NAME#v}"
          scripts/build-packages.sh "$VERSION" dist pkg-out

      - name: Verify packages install on each distribution
        run: scripts/test-packages.sh "${TAG_NAME#v}" pkg-out amd64

      - name: Attach packages to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" pkg-out/*

      - name: Publish package repositories (APT, RPM, Alpine)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          BASE_URL: https://ekovshilovsky.github.io/op-forward
        run: |
          VERSION="${TAG_NAME#v}"
          sudo apt-get install -y -q createrepo-c >/dev/null

          # The gh-pages branch hosts every repository under one site:
          #   /            APT  (dists/, pool/, key.gpg)
          #   /rpm         dnf  (<arch>/repodata, op-forward.repo)
          #   /apk         apk  (<arch>/APKINDEX.tar.gz, op-forward.rsa.pub)
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git clone --branch gh-pages --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/ekovshilovsky/op-forward.git" /tmp/repo
          else
            mkdir -p /tmp/repo
            git -C /tmp/repo init -b gh-pages
          fi

          # Keep previous versions in every repository so users who have not
          # upgraded can still install the release they pinned.
          mkdir -p /tmp/repo/pool /tmp/repo/rpm/x86_64 /tmp/repo/rpm/aarch64 /tmp/repo/apk/x86_64 /tmp/repo/apk/aarch64
          cp pkg-out/*.deb /tmp/repo/pool/
          cp pkg-out/*.x86_64.rpm /tmp/repo/rpm/x86_64/
          cp pkg-out/*.aarch64.rpm /tmp/repo/rpm/aarch64/

          export GPG_KEY_ID
          scripts/build-apt-repo.sh /tmp/repo
          scripts/build-rpm-repo.sh /tmp/repo "$BASE_URL"

          if [ -n "${NFPM_APK_KEY_FILE:-}" ]; then
            cp pkg-out/*_x86_64.apk /tmp/repo/apk/x86_64/
            cp pkg-out/*_aarch64.apk /tmp/repo/apk/aarch64/
            scripts/build-apk-repo.sh /tmp/repo "$NFPM_APK_KEY_FILE" op-forward
          else
            echo "APK_RSA_PRIVATE_KEY not set; skipping the Alpine repository"
          fi

          cat > /tmp/repo/index.html <<INDEXEOF
          <!DOCTYPE html>
          <html><head><title>op-forward package repositories</title></head>
          <body>
          <h1>op-forward package repositories</h1>
          <p>Forward 1Password CLI across SSH boundaries with biometric auth.
             Source and releases: <a href="https://github.com/ekovshilovsky/op-forward">github.com/ekovshilovsky/op-forward</a></p>
          <h2>Debian / Ubuntu (APT)</h2>
          <pre>
          curl -fsSL ${BASE_URL}/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/op-forward.gpg
          echo "deb [arch=\$(dpkg --print-architecture) signed-by=/usr/share/keyrings/op-forward.gpg] ${BASE_URL} stable main" | sudo tee /etc/apt/sources.list.d/op-forward.list
          sudo apt-get update &amp;&amp; sudo apt-get install op-forward
          </pre>
          <h2>Fedora / RHEL / openSUSE (dnf, yum, zypper)</h2>
          <pre>
          sudo curl -fsSL ${BASE_URL}/rpm/op-forward.repo -o /etc/yum.repos.d/op-forward.repo
          sudo dnf install op-forward
          </pre>
          <h2>Alpine (apk)</h2>
          <pre>
          sudo curl -fsSL ${BASE_URL}/apk/op-forward.rsa.pub -o /etc/apk/keys/op-forward.rsa.pub
          echo "${BASE_URL}/apk" | sudo tee -a /etc/apk/repositories
          sudo apk add op-forward
          </pre>
          <h2>Arch Linux, other distributions, macOS</h2>
          <p>Arch packages (<code>.pkg.tar.zst</code>), static tarballs, and macOS builds are attached to each
             <a href="https://github.com/ekovshilovsky/op-forward/releases">GitHub release</a>;
             Homebrew: <code>brew install ekovshilovsky/tap/op-forward</code>.</p>
          </body></html>
          INDEXEOF

          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: repositories generated under /tmp/repo, not pushed"
            exit 0
          fi
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update package repositories for v${VERSION}"
          if git remote | grep -q origin; then
            git push origin gh-pages
          else
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/ekovshilovsky/op-forward.git"
            git push -u origin gh-pages
          fi

      - name: Upload dry-run output
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.version }}
          path: |
            pkg-out/
            /tmp/repo/
            !/tmp/repo/.git
          retention-days: 7
